      #       Tx_GPIO: GPIOD
      #       Rx_GPIO: GPIOD
      #       Tx_GPIO_PIN: GPIO_PIN_1
      #       Rx_GPIO_PIN: GPIO_PIN_0
      #     Other_Config:
      #       <<: *Serial_4_DMA_Config

    child:
      --: *Auto_Set_Id_DeviceS0
      --: *MotorS_0
      --: *TaiHuS_0

      # --: *Sensor_Custom


