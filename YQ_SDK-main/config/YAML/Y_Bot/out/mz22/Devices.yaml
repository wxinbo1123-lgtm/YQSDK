config:
  cat_motor_device_config: &cat_motor_device_config
    <<: *Usr_Motor_Init_Config
    <<: *MZ_22MM_G21_Motor_default_config

  # cat_motor_device_config35: &cat_motor_device_config35
  #   <<: *Usr_Motor_Init_Config
  #   <<: *MZ_22MM_G35_Motor_default_config

  Motor_Config_Normal_0: &Motor_Config_Normal_0
    DeviceType: Motor_Device 
    CH: Head_Flag_Switch_CH2
    IO_Mod: Main_CMD_IO_Mod_CAN_ONLY

#  Taihu Anchor
  TaiHuS_0: &TaiHuS_0
    - Name: left_limb_iliopsoas  #left_shoulder_pitch
      DeviceType: TaiHu_Custom_Motor
      Id: 2  # **需要手动配电机ID，需与先前上位机实际烧录的电机ID对应
      CH: Head_Flag_Switch_CH1
      IO_Mod: Main_CMD_IO_Mod_CAN_ONLY
      DeviceConfig: *TaiHu_4052_Motor_config

    - Name: left_limb_quadriceps #left_shoulder_roll
      DeviceType: TaiHu_Custom_Motor
      Id: 16  # 实际电机CAN ID=16
      CH: Head_Flag_Switch_CH1
      IO_Mod: Main_CMD_IO_Mod_CAN_ONLY
      DeviceConfig: *TaiHu_4052_Motor_config

    - Name: left_limb_hamstring  #left_shoulder_yaw
      DeviceType: TaiHu_Custom_Motor
      Id: 14
      CH: Head_Flag_Switch_CH1
      IO_Mod: Main_CMD_IO_Mod_CAN_ONLY
      DeviceConfig: *TaiHu_4052_Motor_config
    - Name: right_limb_iliopsoas #right_shoulder_pitch
      DeviceType: TaiHu_Custom_Motor
      Id: 11
      CH: Head_Flag_Switch_CH1
      IO_Mod: Main_CMD_IO_Mod_CAN_ONLY
      DeviceConfig: *TaiHu_4052_Motor_config

    - Name: right_limb_quadriceps #right_shoulder_roll
      DeviceType: TaiHu_Custom_Motor
      Id: 15
      CH: Head_Flag_Switch_CH1
      IO_Mod: Main_CMD_IO_Mod_CAN_ONLY
      DeviceConfig: *TaiHu_4052_Motor_config

    - Name: right_limb_hamstring #right_shoulder_yaw
      DeviceType: TaiHu_Custom_Motor
      Id: 13
      CH: Head_Flag_Switch_CH1
      IO_Mod: Main_CMD_IO_Mod_CAN_ONLY
      DeviceConfig: *TaiHu_4052_Motor_config
 
  MotorS_0: &MotorS_0
    - Name: Motor_1
      Id: 1
      <<: *Motor_Config_Normal_0
      DeviceConfig: 
        <<: *cat_motor_device_config
        DI_I_MAX: 0.72 
        Gear_Ratio: 35.0
        
    - Name: Motor_2
      Id: 1
      <<: *Motor_Config_Normal_0
      DeviceConfig: 
        <<: *cat_motor_device_config
        DI_I_MAX: 0.72 
        Gear_Ratio: 35.0

    - Name: Motor_3
      Id: 1
      <<: *Motor_Config_Normal_0
      DeviceConfig: 
        <<: *cat_motor_device_config

    - Name: Motor_4
      Id: 1
      <<: *Motor_Config_Normal_0
      DeviceConfig: 
        <<: *cat_motor_device_config

    - Name: Motor_5
      Id: 1
      <<: *Motor_Config_Normal_0
      DeviceConfig: 
        <<: *cat_motor_device_config
        DI_I_MAX: 0.72 
        Gear_Ratio: 35.0

    - Name: Motor_6
      Id: 1
      <<: *Motor_Config_Normal_0
      DeviceConfig: 
        <<: *cat_motor_device_config
        DI_I_MAX: 0.72 
        Gear_Ratio: 35.0

    - Name: Motor_7
      Id: 1
      <<: *Motor_Config_Normal_0
      DeviceConfig: 
        <<: *cat_motor_device_config
        
    - Name: Motor_8
      Id: 1
      <<: *Motor_Config_Normal_0
      DeviceConfig: 
        <<: *cat_motor_device_config


  Auto_Set_Id_DeviceS0: &Auto_Set_Id_DeviceS0
    - Name: Auto_Set_Id_0
      DeviceType: Auto_Set_Id 
      Detect: false
      Id: 1
      CH: Head_Flag_Switch_CH2
      IO_Mod: Main_CMD_IO_Mod_CAN_ONLY

      DeviceConfig:
        Run_Set: *Run_Auto_Set_Id
        Start_Id: 10
        Save_Id: *Auto_Set_Id_Save
        Time_Out_Ms: 1000
        DeviceList:
          --: *MotorS_0

Base_Node: 
  - Name: Main_Switch_Board
    Range_Name: X_Hand
    DeviceType: Switch_Board 
    Id: 101
    CH: Head_Flag_CH0
    IO_Mod: Main_CMD_IO_Mod_ETH_To_CAN
    PC_IP: *PC_IP
    IP: 192.168.3.101
    Port: 15100
    Up_Data_Speed: 1000
    Heart_Beat: true

    DeviceConfig:
      PrintMcuTaskStack: false
      Can_S:
       - Can_Instance: 1
         <<: *Classic_Can_1M 
       - Can_Instance: 2
         <<: *FD_Can_2M_4M
        # - Can_Instance: 1 #TaiHu_Motor_CAN
        #   <<: *Classic_Can_1M 
      # Serial_S: *Serial_4_Config
      # Serial_S:
      #   - Serial_CH: UART4
