config:
  : &Run_Auto_Set_Id false
  : &Auto_Set_Id_Save false
  # TaiHu Config
  TaiHu_Motor_Init_Config: &TaiHu_Init_Config
    TaiHu_Motor_Config: true
    TaiHu_Config_Save_Flash: false
  # Above end
  Usr_Motor_Init_Config: &Usr_Motor_Init_Config
    Save_All_Config: false 
    Motor_EN_In_Init: true
    Set_Zero_In_Init: false
    Set_Config_In_Init: false
    Set_Pid_Config_In_Init: false
    Motor_Cal_In_Init: false
