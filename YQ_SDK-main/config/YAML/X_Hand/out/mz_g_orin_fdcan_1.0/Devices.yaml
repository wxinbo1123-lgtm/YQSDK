config:
  cat_motor_device_config: &cat_motor_device_config
    <<: *Usr_Motor_Init_Config
    <<: *MZ_10MM_Motor_default_config
    Gear_multiple: 40

  Motor_Config_Normal_0: &Motor_Config_Normal_0
    DeviceType: Motor_Device 
    CH: Head_Flag_Switch_CH1
    IO_Mod: Main_CMD_IO_Mod_CAN_ONLY

  MotorS_0: &MotorS_0
    - Name: Motor_1
      Id: 1
      <<: *Motor_Config_Normal_0
      DeviceConfig: 
        <<: *cat_motor_device_config
        DI_I_MAX: 0.4
        Gear_multiple: 16
        
    - Name: Motor_2
      Id: 1
      <<: *Motor_Config_Normal_0
      DeviceConfig: 
        <<: *cat_motor_device_config
        DI_I_MAX: 0.4
        Gear_multiple: 4

    - Name: Motor_3
      Id: 1
      <<: *Motor_Config_Normal_0
      DeviceConfig: 
        <<: *cat_motor_device_config

    - Name: Motor_4
      Id: 1
      <<: *Motor_Config_Normal_0
      DeviceConfig: 
        <<: *cat_motor_device_config

    - Name: Motor_5
      Id: 1
      <<: *Motor_Config_Normal_0
      DeviceConfig: 
        <<: *cat_motor_device_config

    - Name: Motor_6
      Id: 1
      <<: *Motor_Config_Normal_0
      DeviceConfig: 
        <<: *cat_motor_device_config


  Auto_Set_Id_DeviceS0: &Auto_Set_Id_DeviceS0
    - Name: Auto_Set_Id_0
      DeviceType: Auto_Set_Id 
      Detect: false
      Id: 1
      CH: Head_Flag_Switch_CH2
      IO_Mod: Main_CMD_IO_Mod_CAN_ONLY

      DeviceConfig:
        Run_Set: false
        Start_Id: 10
        Save_Id: false
        Time_Out_Ms: 1000
        DeviceList:
          --: *MotorS_0


Base_Node: 
  - Name: Switch_Board_Custom_Orin
    Range_Name: X_Hand
    DeviceType: Switch_Board_Custom_Orin
    Id: 101
    CH: Head_Flag_CH0

    DeviceConfig:
      Socket_Can_Instance: can0
      Socket_Can_Bitrate: 2000000
      Socket_Can_Bitrate_Date: 2000000
      Socket_Can_Sample_Point: 0.80
      Socket_Can_D_Sample_Point: 0.80
      PrintMcuTaskStack: false

    child:
      --: *Auto_Set_Id_DeviceS0
      --: *MotorS_0


